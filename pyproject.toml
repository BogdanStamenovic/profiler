[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "profiler"
version = "0.1.0"
description = "Keep the shared parts of ~/.bashrc and ~/.zshrc identical"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
profiler = "profiler.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
