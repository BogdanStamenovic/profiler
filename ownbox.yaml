schema: 1
name: profiler
description: Keep the shared parts of ~/.bashrc and ~/.zshrc identical.
homepage: https://github.com/BogdanStamenovic/profiler
tags: [shell, bash, zsh, dotfiles, systemd, linux]

# Profiler is an Auto Update Changer deployment, so Ownbox drives the same deploy/
# scripts the manual path uses rather than building a second, parallel installation.
# Every one of them needs root, and so does the deployed CLI: the service runs as root
# and its state under /var/lib/profiler is readable only by root.
# The paths below must match deploy/project.conf; tests/test_deployment.py checks that.
install:
  platforms: [linux]
  setup:
    linux:
      - sudo bash deploy/install.sh
      - sudo bash deploy/configure.sh
  update:
    linux:
      - sudo bash deploy/update.sh
  remove:
    linux:
      - sudo bash deploy/uninstall.sh
command:
  linux: sudo /opt/profiler/.venv/bin/profiler --env-file /etc/profiler.env
